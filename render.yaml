# Render Blueprint: New > Blueprint > pick this repository.
# You will be asked for DATABASE_URL, ADMIN_PASSWORD and PUBLIC_SITE_URL.
services:
  - type: web
    name: betel-ai-website
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: PUBLIC_SITE_URL
        sync: false
